schema: ai-system.model_archaeology.source_ledger.v1
updated: 2026-06-03
policy:
  allowed:
    - read_official_model_cards
    - read_official_docs_and_blogs
    - inspect_open_weight_configs_when_licenses_allow
    - benchmark_locally_or_in_sandbox_when_resources_allow
    - extract_architectural_patterns_and_operational_lessons
  forbidden:
    - copying_closed_weights
    - bypassing_license_terms
    - treating_marketing_claims_as_verified_results
    - reproducing proprietary chain-of-thought or hidden system prompts
    - using benchmark claims without source labels
