schema: ai-system.target_ai.capability_roadmap.v1
updated: 2026-06-03
phases:
  - id: phase-0-control-plane
    name: Control Plane Foundation
    status: active
    outcomes:
      - project_maps
      - generated_ai_index
      - operation_cycle
      - handoff_and_audit_ledgers
      - local_git_layers
  - id: phase-1-model-archaeology
    name: Open Model Deconstruction Lab
    status: active
    outcomes:
      - source_ledger
      - capability_matrix
      - deconstruction_protocol
      - target_architecture
      - evaluation_benchmarks
  - id: phase-2-router-and-memory
    name: Router And Memory Substrate
    status: planned
    build_items:
      - model_router_with_fast_deep_vision_code_research_modes
      - hardware_aware_model_fit_and_serving_cookbook
      - unified_context_iq_memory_index
      - source_labeled_claim_store
      - semantic_compression_queue
      - retrieval_policy_by_task_type
  - id: phase-3-repo_agent
    name: Repository-Scale Coding Agent
    status: planned
    build_items:
      - repository_graph_builder
      - edit_localization_engine
      - test_selection_engine
      - patch_generation_protocol
      - review_and_rollback_protocol
  - id: phase-4-windows_agent_platform
    name: Windows Agent Platform
    status: planned
    build_items:
      - screenshot_and_visual_state_reader
      - local_app_action_contract
      - file_type_router
      - localized_annotation_protocol
      - active_operation_permission_gate
  - id: phase-5-deep_research_engine
    name: Deep Research Engine
    status: planned
    build_items:
      - query_planner
      - source_fetcher
      - source_reliability_scorer
      - contradiction_detector
      - citation_bound_synthesis
      - research_memory_pack
  - id: phase-6-autonomous_background_work
    name: Background Autonomous Work
    status: planned
    build_items:
      - long_running_task_state_machine
      - heartbeat_reports
      - checkpoint_restore
      - drift_detector
      - human_escalation_policy
  - id: phase-7-self_hosted_workspace
    name: Self-Hosted AI Workspace
    status: planned
    build_items:
      - local_provider_settings
      - documents_email_calendar_notes_tasks_surfaces
      - deep_research_reports
      - blind_model_compare
      - model_cookbook_download_and_serve_jobs
      - admin_console_security_gates
      - gitignored_runtime_data_store
