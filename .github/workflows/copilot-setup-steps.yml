name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/copilot-setup-steps.yml"
      - ".github/copilot-instructions.md"
      - ".github/instructions/**"
      - ".github/agents/**"
      - "AGENTS.md"
      - "requirements-ci.txt"
  pull_request:
    paths:
      - ".github/workflows/copilot-setup-steps.yml"
      - ".github/copilot-instructions.md"
      - ".github/instructions/**"
      - ".github/agents/**"
      - "AGENTS.md"
      - "requirements-ci.txt"

jobs:
  copilot-setup-steps:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install validation dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip -r requirements-ci.txt

      - name: Validate repository structure and data
        shell: pwsh
        run: python tools/validate_repository.py

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q tools "Nexus V/scripts" "Nexus V/toolchain"

      - name: Run Athena repository checks
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "./tools/Test-AthenaRepository.ps1") {
            ./tools/Test-AthenaRepository.ps1 -NoWrite
          } else {
            Write-Host "tools/Test-AthenaRepository.ps1 is not present on this branch; skipping Athena-specific PowerShell check."
          }
