name: Bootstrap AIO Contract

on:
  push:
    branches:
      - agent/forge-v0-1-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7.0.1
        with:
          ref: agent/forge-v0-1-foundation
          fetch-depth: 0

      - name: Reconstruct implementation bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/aio-bootstrap/chunk-* | tr -d '\r\n' > /tmp/aio_bundle.b64
          base64 --decode /tmp/aio_bundle.b64 > /tmp/aio_bundle.tar.gz
          tar -xzf /tmp/aio_bundle.tar.gz -C .

      - name: Replace pairwise contracts with generated views
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            forge/adapters/AESIR-CONTRACT.md \
            forge/adapters/ATHENA-CONTRACT.md \
            forge/adapters/HAIPS-CONTRACT.md \
            aesir/adapters/ATHENA-CONTRACT.md \
            aesir/adapters/FORGE-CONTRACT.md
          rm -rf .github/aio-bootstrap
          rm -f .github/workflows/bootstrap-aio-contract.yml

      - name: Validate AIO implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip -r requirements-ci.txt
          python -m compileall -q tools forge standards contracts
          python -m unittest discover -s standards/human-ai-pipeline/tests -p 'test_*.py'
          python tools/aio_contract.py validate-master contracts/AIO-MASTER-CONTRACT.yml
          python tools/aio_contract.py instantiate \
            --master contracts/AIO-MASTER-CONTRACT.yml \
            --input standards/human-ai-pipeline/examples/aio-input.example.json \
            --out /tmp/aio-instance.json
          python tools/aio_contract.py validate-instance /tmp/aio-instance.json

      - name: Commit materialized AIO system
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No AIO materialization changes to commit.'
            exit 0
          fi
          git commit -m 'Implement unified AIO contract and omni-pipeline'
          git push origin HEAD:agent/forge-v0-1-foundation
