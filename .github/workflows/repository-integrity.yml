name: Repository Integrity

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip -r requirements-ci.txt
      - name: Validate repository structure and data
        run: python tools/validate_repository.py
      - name: Compile Python sources
        run: python -m compileall -q tools forge standards "Nexus V/scripts" "Nexus V/toolchain"
      - name: Run F.O.R.G.E. unit tests
        run: python -m unittest discover -s forge/tests -p "test_*.py"
      - name: Run shared human-AI pipeline tests
        run: python -m unittest discover -s standards/human-ai-pipeline/tests -p "test_*.py"
      - name: Validate human-AI pipeline profiles
        run: |
          python tools/human_ai_pipeline.py compliance \
            --root . \
            --profiles \
              standards/human-ai-pipeline/profiles/athena.yml \
              standards/human-ai-pipeline/profiles/aesir.yml \
              standards/human-ai-pipeline/profiles/forge.yml
      - name: Validate and render shared run example
        run: |
          python tools/human_ai_pipeline.py validate standards/human-ai-pipeline/examples/run-packet.example.json
          python tools/human_ai_pipeline.py render standards/human-ai-pipeline/examples/run-packet.example.json --out artifacts/human-ai-pipeline-example.md
      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $allErrors = [System.Collections.Generic.List[string]]::new()
          Get-ChildItem -Path tools -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$parseErrors) | Out-Null
            foreach ($parseError in $parseErrors) { $allErrors.Add("$($_.FullName): $($parseError.Message)") }
          }
          if ($allErrors.Count -gt 0) { $allErrors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Publish validation report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: repository-integrity-report
          path: |
            artifacts/repository-integrity.json
            artifacts/human-ai-pipeline-example.md
          if-no-files-found: warn
