name: Repository Integrity

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip -r requirements-ci.txt

      - name: Validate repository structure and data
        run: python tools/validate_repository.py

      - name: Compile Python sources
        run: python -m compileall -q tools forge "Nexus V/scripts" "Nexus V/toolchain"

      - name: Run F.O.R.G.E. unit tests
        run: python -m unittest discover -s forge/tests -p "test_*.py"

      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $allErrors = [System.Collections.Generic.List[string]]::new()
          Get-ChildItem -Path tools -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            foreach ($parseError in $parseErrors) {
              $allErrors.Add("$($_.FullName): $($parseError.Message)")
            }
          }

          if ($allErrors.Count -gt 0) {
            $allErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Publish validation report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: repository-integrity-report
          path: artifacts/repository-integrity.json
          if-no-files-found: warn
