schema: ai-system.council_roles.v2
updated: 2026-08-05
scope: project_neutral
activation:
  default_profile: athena-core
  project_specific_roles: council/profiles
roles:
  - id: systems_architect
    focus: architecture, interfaces, dependencies, scalability
  - id: safety_reviewer
    focus: privacy, hazardous actions, permissions, rollback
  - id: governance_reviewer
    focus: authority, policy, publication boundaries, accountability
  - id: memory_architect
    focus: context, durable memory, writeback, retrieval, anti-drift
  - id: evidence_auditor
    focus: provenance, claim grounding, confidence, reproducibility
  - id: runtime_engineer
    focus: services, adapters, orchestration, failure handling
  - id: compiler_engineer
    focus: languages, schemas, parsers, lowering, generated artifacts
  - id: hardware_architect
    focus: RTL, interfaces, timing, physical constraints, verification
  - id: observability_engineer
    focus: logs, probes, telemetry, diagnostics, health models
  - id: research_lead
    focus: prior art, experiments, uncertainty, external evidence
  - id: qa_verification
    focus: tests, regression, independent verification, acceptance criteria
  - id: product_operator
    focus: usability, workflow, priorities, human outcomes
  - id: contrarian
    focus: counterarguments, failure modes, hidden assumptions, black swans
