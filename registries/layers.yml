schema: ai-system.layers.v1
updated: 2026-07-10
hosting_policy: local_only
layers:
  - id: project-athena
    name: Project Athena Workspace
    path: .
    git_role: root_workspace
    sensitivity: private_local_ai_system
    commit_policy: commit_root_context_tools_and_docs_together_when_related
    owns:
      - AI-PORTAL.md
      - START-HERE.md
      - README.md
      - context.md
      - context-file-index.md
  - id: plan
    name: Plan Architecture Vault
    path: Plan
    git_role: architecture_source
    sensitivity: design_intent
    commit_policy: update_when_architecture_or_priorities_change
    owns:
      - Plan/context.md
      - Plan/ROADMAP.md
      - Plan/TODO.md
      - Plan/TODO_STATUS.md
      - Plan/QUALITY_PLAN.md
      - Plan/FEATURE_ROADMAP.md
      - Plan/IMPLEMENTATION_MATRIX.md
  - id: nexus-v
    name: Nexus V Hardware And Toolchain
    path: Nexus V
    git_role: implementation_subsystem
    sensitivity: source_and_generated_artifacts
    commit_policy: separate generated artifacts from source changes when practical
    owns:
      - Nexus V/rtl
      - Nexus V/toolchain
      - Nexus V/scripts
      - Nexus V/reports
      - Nexus V/docs
  - id: athena-engine
    name: Athena Operation Engine
    path: engine
    git_role: processor_loop
    sensitivity: process_memory
    commit_policy: update cycle reports and templates with process changes
  - id: athena-memory
    name: Athena Memory
    path: memory
    git_role: durable_memory
    sensitivity: contextual_memory
    commit_policy: update only verified or explicitly labeled inferred facts
  - id: athena-work
    name: Athena Work System
    path: work
    git_role: working_memory
    sensitivity: task_state
    commit_policy: keep actionable work and status current
  - id: athena-tools
    name: Athena Tools
    path: tools
    git_role: local_tools
    sensitivity: local_execution
    commit_policy: keep default paths rooted at Project Athena
  - id: legacy-wow
    name: Legacy WoW Backup Stack Records
    path: projects/wow-backup-stack
    git_role: retained_project_brain
    sensitivity: historical_private_project_context
    commit_policy: preserve for history unless the human reactivates the project
