<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><style>.b{fill:#071018}.x{fill:#102534;stroke:#70d8ff;stroke-width:3}.y{fill:#2b2411;stroke:#ffc85b;stroke-width:3}.z{fill:#14251d;stroke:#6cff9c;stroke-width:3}.t{fill:#eef8ff;font:26px sans-serif}.s{fill:#c3dce8;font:19px sans-serif}.l{stroke:#76dfff;stroke-width:4}</style><rect class="b" width="1600" height="900"/><text class="t" x="55" y="55">MATERIAL BEHAVIORAL ATLAS — CAMPAIGN TO IDENTIFICATION</text><rect class="x" x="60" y="130" width="360" height="560" rx="25"/><text class="t" x="95" y="180">Per Domain Campaign</text><text class="s" x="95" y="250">10,000 unique configurations</text><text class="s" x="95" y="295">× 10 repeated executions</text><text class="s" x="95" y="340">= 100,000 executions</text><text class="s" x="95" y="420">All sensor outputs captured</text><text class="s" x="95" y="465">simultaneously per execution</text><rect class="y" x="620" y="130" width="360" height="560" rx="25"/><text class="t" x="665" y="180">Known Behavioral Map</text><text class="s" x="655" y="250">10 repetitions → validated point</text><text class="s" x="655" y="295">10,000 points → response surface</text><text class="s" x="655" y="360">Mean • variance • covariance</text><text class="s" x="655" y="405">failure boundaries • uncertainty</text><text class="s" x="655" y="470">material • grade • batch • object</text><rect class="z" x="1180" y="130" width="360" height="560" rx="25"/><text class="t" x="1220" y="180">Athena / OASIS Use</text><text class="s" x="1215" y="250">Identify material and condition</text><text class="s" x="1215" y="295">Estimate properties and ranges</text><text class="s" x="1215" y="340">Select discriminating tests</text><text class="s" x="1215" y="385">Simulate exact objects</text><text class="s" x="1215" y="430">Select/design materials</text><text class="s" x="1215" y="475">Design composites/interfaces</text><path class="l" d="M420 410 L620 410"/><path class="l" d="M980 410 L1180 410"/><text class="s" x="210" y="795">Physical evidence anchors simulation; simulation count alone never creates truth.</text></svg>
