metadata:
  title: Athena Master Ontology
  generated: 2026-08-05
  updated: 2026-08-05_Athena_Docking_Fabric_HotSwap_Addendum
  source_pack: docs/athena-master-expansion
  method: A.E.S.I.R. Polymath Discovery Engine
  governance: repo_canonical_plugins_mirror_or_execute

status_labels:
  implemented: "Exists as working repo code/tool/script or verified artifact."
  scaffolded: "Repo structure or placeholder exists, but implementation is incomplete."
  specified: "Documented with enough detail to guide implementation."
  conceptual: "Defined conceptually but not yet a formal implementation spec."
  speculative: "Future R&D or hardware/science concept; do not claim implementation."
  blocked: "Requires missing local verification, tools, data, component choice, or user approval."

nodes:
  A_E_S_I_R:
    name: "A.E.S.I.R. Polymath Discovery Engine"
    type: reasoning_framework
    status: specified
    definition: "Adaptive Evolutionary System for Intelligent Research; single canonical deep-reasoning mode for complex investigation."
    feeds:
      - Athena_AI_OS
      - Athena_Docking_Fabric
      - Research_Council
      - Evidence_Discipline
      - Concept_Graph

  Athena_AI_OS:
    name: "Athena / AI-OS"
    type: institutional_intelligence_control_plane
    status: specified
    definition: "Local-first institutional cognition, governance, evidence, memory, orchestration, continuity, and project-brain control plane."
    receives:
      - A_E_S_I_R
      - OASIS
      - Plugin_Outputs
      - Local_Verification
      - Athena_Docking_Fabric
    feeds:
      - Cognitive_Orchestrator
      - Nexus_V
      - Evidence_Provenance
      - Agent_Routing
      - Project_Memory
      - Athena_Docking_Fabric

  Athena_Docking_Fabric:
    name: "Athena Docking Fabric"
    type: distributed_hot_swappable_cognitive_interface_fabric
    status: specified
    definition: "Distributed Athena placement across AI-local nodes, external Athena core, connective highway, project capsules, durable memory, plugins, and OASIS runtime so models, tools, databases, and project capsules can be swapped or cloned without losing continuity."
    receives:
      - A_E_S_I_R
      - Athena_AI_OS
      - OASIS
      - Plugin_Outputs
      - Local_Verification
    feeds:
      - AI_Local_Athena_Node
      - External_Athena_Core
      - Athena_Connective_Highway
      - Project_Athena_Capsule
      - Group_Skill_Library
      - Model_Specific_Skill_Adapter
      - Database_Highway_Skill_Adapter
      - OASIS_Runtime_Interface

  AI_Local_Athena_Node:
    name: "AI-local Athena Node"
    type: model_specific_interface_layer
    status: specified
    definition: "Athena grammar, tool contract, context-shaping policy, local reasoning protocol, and model-specific skill wrapper that lives inside a given AI/model/session."
    receives:
      - Athena_Docking_Fabric
      - Model_Specific_Skill_Adapter
    feeds:
      - Athena_Connective_Highway
      - Cognitive_Orchestrator
    boundary_rule: "May be replaced with the model; must never be the only copy of project intelligence."

  External_Athena_Core:
    name: "External Athena Core"
    type: model_independent_orchestration_core
    status: specified
    definition: "Independent Athena control plane for governance, memory routing, skill registry, evidence discipline, project-brain coordination, and model/tool selection."
    receives:
      - Athena_Connective_Highway
      - Project_Athena_Capsule
      - Group_Skill_Library
    feeds:
      - Cognitive_Orchestrator
      - Evidence_Provenance
      - Project_Memory
      - Plugin_Action_Register
    boundary_rule: "Must not depend on a single model vendor or runtime."

  Athena_Connective_Highway:
    name: "Athena Connective Highway"
    type: adapter_router_translation_and_provenance_bus
    status: specified
    definition: "Interchangeable route layer between AI models, databases, files, plugins, local tools, OASIS, project capsules, and external Athena core. Handles adapters, schemas, context compression, authentication, write gates, and provenance."
    receives:
      - AI_Local_Athena_Node
      - External_Athena_Core
      - Plugin_Outputs
      - Local_Verification
    feeds:
      - Project_Athena_Capsule
      - Memory_Substrate
      - Plugin_Surfaces
      - OASIS_Runtime_Interface
      - Evidence_Provenance
    boundary_rule: "Must not silently rewrite claim status, authority, evidence, provenance, or permissions."

  Project_Athena_Capsule:
    name: "Project Athena Capsule"
    type: portable_project_brain_package
    status: specified
    definition: "Project-specific brain containing ontology, assumptions, goals, decisions, skills, artifacts, test plans, diagrams, evidence, and scoped memory. Can be cloned, forked, merged, rebased, imported, or exported."
    receives:
      - Athena_Connective_Highway
      - External_Athena_Core
      - Project_Memory
    feeds:
      - Nexus_V
      - OASIS
      - Plugin_Surfaces
      - Evidence_Provenance
    boundary_rule: "Project memory can specialize but must not promote into institutional memory without validation."

  Group_Skill_Library:
    name: "Group Skill Library"
    type: reusable_validated_skill_layer
    status: specified
    definition: "Validated general skills shared across projects, including A.E.S.I.R. research process, evidence review, systems mapping, engineering decomposition, ontology management, and memory compression."
    receives:
      - A_E_S_I_R
      - Memory_Writeback
    feeds:
      - External_Athena_Core
      - Project_Athena_Capsule

  Model_Specific_Skill_Adapter:
    name: "Model-specific Skill Adapter"
    type: ai_model_adapter_layer
    status: specified
    definition: "Model-specific interface for GPT, local LLMs, Codex-like coding agents, or future models; stores format rules, context-limit workarounds, tool syntax, and model strengths/weaknesses."
    feeds:
      - AI_Local_Athena_Node

  Database_Highway_Skill_Adapter:
    name: "Database / Highway Skill Adapter"
    type: backend_tool_adapter_layer
    status: specified
    definition: "Backend-specific interface for SQL, vector, graph, document stores, GitHub, Notion, Asana, Drive, local tools, and other plugin surfaces."
    feeds:
      - Athena_Connective_Highway
      - Memory_Substrate
      - Plugin_Surfaces

  OASIS_Runtime_Interface:
    name: "OASIS Runtime Interface"
    type: simulation_action_spatial_runtime_bridge
    status: conceptual
    definition: "Bridge between Athena, OASIS digital world, engineering workshops, spatial state, simulated environments, VR/XR interactions, and future Operative Duplex action loops."
    receives:
      - Athena_Docking_Fabric
      - OASIS
      - RoomSense
      - Operative_Duplex_AI
    feeds:
      - Athena_Connective_Highway
      - Project_Athena_Capsule
      - Evidence_Provenance

  Memory_Substrate:
    name: "Durable Memory / File / Database Substrate"
    type: persistent_memory_and_evidence_storage_layer
    status: scaffolded
    definition: "Durable project and institutional storage across repository files, documents, SQL/vector/graph/document stores, manifests, audit logs, and evidence packs."
    receives:
      - Athena_Connective_Highway
      - Project_Athena_Capsule
      - Evidence_Provenance
    feeds:
      - Project_Memory
      - Memory_Writeback
      - Local_Verification

  Cognitive_Orchestrator:
    name: "Project Athena Cognitive Orchestrator"
    type: reasoning_and_routing_layer
    status: specified
    definition: "Classifies tasks, routes agents/councils, manages disagreement, confidence, evidence, and memory writeback."
    receives:
      - Athena_AI_OS
      - External_Athena_Core
      - AI_Local_Athena_Node
    feeds:
      - Agent_Council
      - Plugin_Action_Register
      - Cycle_Reports

  Agent_Council:
    name: "Cognitive Senate / Research Council"
    type: multi_agent_reasoning_layer
    status: specified
    receives:
      - Cognitive_Orchestrator
      - A_E_S_I_R
    feeds:
      - Evidence_Provenance
      - Project_Decisions

  Evidence_Provenance:
    name: "Evidence / Claim / Provenance Layer"
    type: trust_and_audit_layer
    status: scaffolded
    receives:
      - Athena_AI_OS
      - Agent_Council
      - Plugin_Outputs
      - Local_Verification
      - Athena_Connective_Highway
      - OASIS_Runtime_Interface
    feeds:
      - Nexus_V
      - Aegis
      - Cycle_Reports
      - Memory_Writeback

  Nexus_V:
    name: "Nexus-V"
    type: semantic_versioned_execution_layer
    status: specified
    definition: "Versioned state compute using commit, branch, fork, merge, diff, rebase, checkout, rollback, snap/restore, score/rank/select, Aegis, NVASM, NVIR, NVOBJ, NVVM, RTL/toolchain work."
    receives:
      - Athena_AI_OS
      - Evidence_Provenance
      - Project_Athena_Capsule
    feeds:
      - Aegis
      - Lightcore
      - Versioned_State_Objects

  Aegis:
    name: "Aegis"
    type: commit_gate_attestation_layer
    status: specified
    receives:
      - Nexus_V
      - Evidence_Provenance
    feeds:
      - Commit_Records
      - Trust_Telemetry
      - Rollback_Control
      - LODE_TV
      - RoomSense

  Lightcore:
    name: "Lightcore"
    type: future_physical_execution_profile
    status: speculative
    definition: "XYZ CNT-silicon-photonic compute architecture with dual-purpose electro-photonic CNT cells, silicon/silicon-nitride photonics, multidimensional optical/PAM signalling, and optical/crystal/CNT memory."
    receives:
      - Nexus_V
      - Aegis
    feeds:
      - LODE_TV
      - RoomSense
      - Photonic_Compute_R_and_D

  LODE_TV:
    name: "L.O.D.E TV"
    expansion: "Lightcore Optical Display Endpoint"
    type: photonic_display_sensor_endpoint
    status: specified
    definition: "Photonic-native display/interaction endpoint; final architecture avoids HDMI/DP conventional framebuffer pipeline."
    receives:
      - Lightcore
      - Aegis
      - OASIS
    feeds:
      - RoomSense
      - Display_Telemetry
      - XR_Interaction
      - Optical_UI

  RoomSense:
    name: "RoomSense"
    type: local_spatial_sensing_fabric
    status: conceptual
    definition: "Local-first room-scale spatial sensing with LiDAR/camera/RF/screen/headset/controller fusion."
    receives:
      - LODE_TV
      - Lightcore
      - Headset_Sensors
      - Room_Towers
    feeds:
      - BodyRig
      - Sentinel_Security
      - OASIS
      - Athena_AI_OS
      - OASIS_Runtime_Interface

  BodyRig:
    name: "RoomSense BodyRig"
    type: markerless_full_body_tracking_layer
    status: conceptual
    definition: "Markerless full-body VR/XR tracking using inside-out/outside-in fusion, relational tracking, human-state reconstruction, and virtual tracker output."
    receives:
      - RoomSense
    feeds:
      - VRChat_Integration
      - OpenXR_Integration
      - SteamVR_OSC_Integration
      - Motion_Capture
      - Embodied_Motion_Fidelity
      - OASIS_Runtime_Interface

  OASIS:
    name: "OASIS"
    type: digital_world_simulation_environment
    status: conceptual
    definition: "Outer digital operating environment for engineering, simulation, games, virtual workspaces, R&D, production, schematic workshops, and immersive worlds."
    receives:
      - Athena_AI_OS
      - LODE_TV
      - RoomSense
      - Operative_Duplex_AI
      - OASIS_Runtime_Interface
    feeds:
      - Simulation_State
      - Spatial_Workflows
      - User_Interfaces
      - OASIS_Runtime_Interface

  Operative_Duplex_AI:
    name: "Operative Duplex AI"
    type: local_action_metacognitive_control_layer
    status: conceptual
    definition: "AI arms-and-legs layer for local PC/software control using Athena/Jarvis/OASIS context; not a replacement for Athena."
    receives:
      - Athena_AI_OS
      - OASIS
      - Local_Program_State
      - OASIS_Runtime_Interface
    feeds:
      - Local_Automation
      - Codex_Workflows
      - UI_Control
      - Action_Reports

plugin_surfaces:
  GitHub:
    role: canonical_repository_commit_issue_and_trace_surface
    allowed_for:
      - sanitized_documentation
      - issues
      - pull_requests
      - public_architecture_specs
      - code_after_review
    not_allowed_for:
      - raw_private_chats
      - credentials
      - local_runtime_dumps
      - private_sensor_data
      - SQL_dumps

  Asana:
    role: execution_queue_task_management
    source_of_truth: false

  Notion:
    role: planning_dashboard_and_mirror
    source_of_truth: false

  Gamma:
    role: presentation_and_communication_artifacts
    source_of_truth: false

  Google_Drive:
    role: export_and_distribution_mirror
    source_of_truth: false

  Canva:
    role: controlled_infographic_and_visual_board_workspace
    source_of_truth: false

  Figma:
    role: editable_system_diagram_dashboard_and_ui_design_workspace
    source_of_truth: false

  Consensus:
    role: peer_reviewed_research_anchor_search
    source_of_truth: false

  SciSpace:
    role: independent_academic_cross_check
    source_of_truth: false

  Wolfram:
    role: math_physics_geometry_sanity_check
    source_of_truth: false

  Local_Athena_Tools:
    role: verification_integrity_manifest_project_map_forensics_cycle_reports
    source_of_truth: local_first
    push_gate: sanitize_before_cloud

hot_swap_primitives:
  commit: "Save verified project state or accepted documentation."
  branch: "Create alternate design path."
  fork: "Create independent project/capsule line."
  merge: "Reconcile validated branches."
  diff: "Compare states, assumptions, schemas, or specs."
  rebase: "Move a project onto a newer Athena/AI-OS/Nexus foundation."
  rollback: "Restore a known-good state."
  snapshot: "Freeze project state for audit/handoff."
  hotswap: "Replace AI model, backend, highway segment, or runtime without losing continuity."
  clone: "Copy project capsule, adapter profile, or skill bundle."
  promote: "Move validated knowledge upward from call/workspace memory."
  quarantine: "Hold unsafe, uncertain, private, contaminated, or unvalidated material outside canonical memory."

immediate_next_artifacts:
  p0:
    - CAPABILITY_STATE_MATRIX.md
    - PLUGIN_ACTION_REGISTER.md
    - GOVERNANCE_CLOUD_PUSH_EXCEPTION_2026-08-05.md
    - CYCLE_REPORT_2026-08-05_MASTER_EXPANSION.md
    - ATHENA_DOCKING_FABRIC_HOTSWAP_SPEC.md
    - ATHENA_DOCKING_FABRIC_INFOGRAPHIC.mmd
  p1:
    - OASIS_ARCHITECTURE_SPEC.md
    - OPERATIVE_DUPLEX_AI_SPEC.md
    - NEXUSV_ATHENA_BRIDGE_SPEC.md
    - LODE_ROOMSENSE_BODYRIG_INTERFACE_SPEC.md
