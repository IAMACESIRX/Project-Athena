metadata:
  title: Project Athena Ecosystem Master Ontology
  generated: 2026-08-05
  updated: 2026-08-05_JANUS_Independent_Identity_Correction
  source_pack: docs/athena-master-expansion
  method: A.E.S.I.R. Polymath Discovery Engine
  governance: repository_canonical_plugins_are_labelled_mirrors_or_execution_surfaces
  supersedes:
    - Operative_Duplex_AI_as_Athena_subsystem
    - OASIS_as_container_or_owner_of_Athena
    - Jarvis_as_only_an_Athena_adapter

status_labels:
  implemented: "Working code, tool, runtime or verified artifact exists."
  scaffolded: "Structure exists but implementation or verification is incomplete."
  specified: "Documented with enough detail to guide implementation."
  conceptual: "Defined conceptually; implementation contract remains incomplete."
  speculative: "Future R&D hypothesis; do not claim implementation or validated performance."
  blocked: "Requires unavailable local tools, component choice, data or human decision."
  superseded: "Retained for provenance but replaced by newer canonical authority."

identity_invariants:
  human_ultimate_authority: true
  athena_jarvis_janus_are_independent_intelligences: true
  oasis_is_not_an_ai: true
  cross_system_edges_are_contracts_not_ownership: true
  model_adapters_do_not_erase_independent_identity: true
  plugin_workspaces_are_not_canonical_by_default: true

nodes:
  Human_Authority:
    name: "Human / ACES Authority"
    type: ultimate_authority
    status: implemented
    feeds: [A_E_S_I_R, Athena_AI_OS, Jarvis_AI, Janus_AI, OASIS]

  A_E_S_I_R:
    name: "A.E.S.I.R. Polymath Discovery Engine"
    expansion: "Adaptive Evolutionary System for Intelligent Research"
    type: integrated_reasoning_framework
    status: specified
    definition: "Single first-principles, systems, mechanism-level, cross-domain discovery process with explicit fact, assumption, hypothesis, constraint, unknown and validation states."
    feeds: [Athena_AI_OS, Jarvis_AI, Janus_AI, Research_Council, Evidence_Provenance, Concept_Graph]

  Athena_AI_OS:
    name: "ATHENA / AI-OS"
    type: independent_institutional_intelligence
    status: specified
    definition: "Persistent institutional cognition, governance, evidence, memory, ontology, councils, project coordination, continuity and long-horizon learning."
    receives: [Human_Authority, A_E_S_I_R, Plugin_Outputs, Local_Verification, Janus_Action_Reports, Jarvis_Context, OASIS_Project_Evidence]
    feeds: [Cognitive_Orchestrator, Evidence_Provenance, Project_Memory, Athena_Docking_Fabric, Jarvis_AI, Janus_AI, OASIS_Runtime_Interface, Nexus_V]
    boundary_rule: "ATHENA may advise, govern institutional memory and issue scoped requests; it is not JANUS's internal brain or owner and does not own JARVIS or OASIS."

  Jarvis_AI:
    name: "JARVIS"
    type: independent_personal_executive_intelligence
    status: conceptual
    definition: "Human-facing dialogue, personal context, preference, schedule, device and immediate executive-orchestration intelligence."
    receives: [Human_Authority, Athena_AI_OS, Janus_Action_Reports, OASIS_Runtime_Interface]
    feeds: [Human_Authority, Athena_AI_OS, Janus_AI, OASIS_Runtime_Interface, Jarvis_Context]
    boundary_rule: "JARVIS can use an ATHENA adapter but is not defined only as an ATHENA adapter."

  Janus_AI:
    name: "JANUS"
    expansion: "Joint Adaptive Neurocognitive Operative System"
    type: independent_operative_metacognitive_intelligence
    status: specified
    definition: "Conjoined operative AI with an Interior metacognitive face and Exterior perception/action face; maps and operates software/OASIS, learns unfamiliar programs, compiles Skill Capsules and verifies actual state changes."
    receives: [Human_Authority, Athena_AI_OS, Jarvis_AI, OASIS_Runtime_Interface, Local_Program_State, RoomSense, LODE_TV, Evidence_Provenance]
    feeds: [Janus_Action_Reports, Local_Automation, Application_Cartographer, Skill_Capsule_Registry, OASIS_Runtime_Interface, External_Software, Authorized_Machinery, Evidence_Provenance]
    authority_file: "JANUS_OPERATIVE_METACOGNITIVE_AI_MASTER_SPEC.md"
    boundary_rule: "JANUS is not an ATHENA subsystem, not OASIS, not JARVIS and not a shell wrapper."

  Janus_Interior_Face:
    name: "JANUS Interior Face"
    type: metacognition_and_authority_engine
    status: specified
    receives: [Janus_Exterior_Face, Evidence_Provenance, Authority_Tokens]
    feeds: [Janus_Operation_Planner, Independent_Verifier, Commit_Decision]

  Janus_Exterior_Face:
    name: "JANUS Exterior Face"
    type: perception_action_and_state_verification_engine
    status: specified
    receives: [Janus_Operation_Planner, Local_Program_State, OASIS_Runtime_Interface, RoomSense, LODE_TV]
    feeds: [Janus_Interior_Face, Observed_State_Diffs, Application_Cartographer, Janus_Action_Reports]

  Application_Cartographer:
    name: "JANUS Application Cartographer"
    type: controlled_program_discovery_system
    status: specified
    receives: [Janus_Exterior_Face, Sandbox_State, Human_Demonstrations]
    feeds: [Application_Capability_Hypotheses, Skill_Capsule_Registry, Evidence_Provenance]

  Skill_Capsule_Registry:
    name: "JANUS Skill Capsule Registry"
    type: versioned_reusable_verified_workflow_store
    status: planned
    receives: [Application_Cartographer, Human_Demonstrations, Validation_Results]
    feeds: [Janus_Operation_Planner]

  OASIS:
    name: "OASIS"
    type: non_ai_persistent_digital_reality_and_simulation_substrate
    status: specified
    definition: "Programmable digital world for engineering, science, simulation, games, virtual living/work, R&D think tanks, digital twins, production and schematic workshops, and human/AI embodiment."
    receives: [Human_Authority, Athena_AI_OS, Jarvis_AI, Janus_AI, LODE_TV, RoomSense, BodyRig, Reality_to_Simulation, Known_Behavioral_Map]
    feeds: [OASIS_Runtime_Interface, Simulation_State, Spatial_Workflows, Engineering_Exports, OASIS_Project_Evidence]
    boundary_rule: "OASIS hosts worlds and runtime services; it is not an AI and does not contain or own ATHENA, JARVIS or JANUS."

  OASIS_Runtime_Interface:
    name: "OASIS Runtime Interface"
    type: identity_aware_world_simulation_and_action_bridge
    status: conceptual
    receives: [OASIS, Athena_AI_OS, Jarvis_AI, Janus_AI, RoomSense, BodyRig]
    feeds: [Athena_AI_OS, Jarvis_AI, Janus_AI, Project_Athena_Capsule, Evidence_Provenance]
    boundary_rule: "Requests preserve requester identity, authority, privacy, expected state diff and provenance."

  Athena_Docking_Fabric:
    name: "ATHENA Docking Fabric"
    type: distributed_hot_swappable_institutional_interface_fabric
    status: specified
    definition: "ATHENA placement across model-local nodes, external ATHENA core, connective highway, project capsules, durable memory and plugin surfaces without making every attached intelligence an ATHENA subsystem."
    receives: [Athena_AI_OS, A_E_S_I_R, Plugin_Outputs, Local_Verification]
    feeds: [AI_Local_Athena_Node, External_Athena_Core, Athena_Connective_Highway, Project_Athena_Capsule, Group_Skill_Library, Database_Highway_Skill_Adapter]

  AI_Local_Athena_Node:
    name: "AI-local ATHENA Node"
    type: model_specific_athena_interface
    status: specified
    definition: "ATHENA grammar, context shaping, local reasoning protocol and tool contract inside a replaceable model/session."
    receives: [Athena_Docking_Fabric, Model_Specific_Skill_Adapter]
    feeds: [Athena_Connective_Highway, Cognitive_Orchestrator]
    boundary_rule: "Never the only copy of institutional/project intelligence and never automatic proof that the host AI is ATHENA-owned."

  External_Athena_Core:
    name: "External ATHENA Core"
    type: model_independent_institutional_core
    status: specified
    receives: [Athena_Connective_Highway, Project_Athena_Capsule, Group_Skill_Library]
    feeds: [Cognitive_Orchestrator, Evidence_Provenance, Project_Memory, Plugin_Action_Register]
    boundary_rule: "Must not depend on a single model vendor or runtime."

  Athena_Connective_Highway:
    name: "ATHENA Connective Highway"
    type: adapter_router_translation_and_provenance_bus
    status: specified
    receives: [AI_Local_Athena_Node, External_Athena_Core, Plugin_Outputs, Local_Verification]
    feeds: [Project_Athena_Capsule, Memory_Substrate, Plugin_Surfaces, OASIS_Runtime_Interface, Evidence_Provenance]
    boundary_rule: "Must not rewrite identity, claim status, authority, evidence, privacy or provenance."

  Project_Athena_Capsule:
    name: "Project ATHENA Capsule"
    type: portable_project_brain_package
    status: specified
    receives: [Athena_Connective_Highway, External_Athena_Core, Project_Memory]
    feeds: [Nexus_V, OASIS, Plugin_Surfaces, Evidence_Provenance]
    boundary_rule: "Project memory cannot promote to institutional memory without validation."

  Group_Skill_Library:
    name: "Group Skill Library"
    type: reusable_validated_institutional_skill_layer
    status: specified
    receives: [A_E_S_I_R, Memory_Writeback]
    feeds: [External_Athena_Core, Project_Athena_Capsule]

  Model_Specific_Skill_Adapter:
    name: "Model-specific Skill Adapter"
    type: model_interoperability_layer
    status: specified
    feeds: [AI_Local_Athena_Node]

  Database_Highway_Skill_Adapter:
    name: "Database / Highway Skill Adapter"
    type: backend_and_plugin_adapter_layer
    status: specified
    feeds: [Athena_Connective_Highway, Memory_Substrate, Plugin_Surfaces]

  Memory_Substrate:
    name: "Durable Memory / File / Database Substrate"
    type: persistent_storage_and_evidence_layer
    status: scaffolded
    receives: [Athena_Connective_Highway, Project_Athena_Capsule, Evidence_Provenance]
    feeds: [Project_Memory, Memory_Writeback, Local_Verification]

  Cognitive_Orchestrator:
    name: "Project ATHENA Cognitive Orchestrator"
    type: institutional_reasoning_and_routing_layer
    status: specified
    receives: [Athena_AI_OS, External_Athena_Core, AI_Local_Athena_Node]
    feeds: [Agent_Council, Plugin_Action_Register, Cycle_Reports]

  Agent_Council:
    name: "Cognitive Senate / Research Council"
    type: multi_agent_reasoning_layer
    status: specified
    receives: [Cognitive_Orchestrator, A_E_S_I_R]
    feeds: [Evidence_Provenance, Project_Decisions]

  Evidence_Provenance:
    name: "Evidence / Claim / Provenance Layer"
    type: trust_and_audit_layer
    status: scaffolded
    receives: [Athena_AI_OS, Agent_Council, Janus_Action_Reports, Plugin_Outputs, Local_Verification, OASIS_Runtime_Interface, Reality_to_Simulation]
    feeds: [Nexus_V, Aegis, Cycle_Reports, Memory_Writeback, Janus_Interior_Face]

  Nexus_V:
    name: "Nexus-V"
    type: semantic_versioned_execution_architecture
    status: specified
    definition: "Versioned state compute using commit, branch, fork, merge, diff, rebase, checkout, rollback, snap/restore and score/rank/select, with NVASM/NVIR/NVOBJ/NVVM/RTL work."
    receives: [Athena_AI_OS, Janus_AI, OASIS, Evidence_Provenance, Project_Athena_Capsule]
    feeds: [Aegis, Lightcore, Versioned_State_Objects]
    boundary_rule: "Provides execution/state services; does not define AI identity."

  Aegis:
    name: "Aegis"
    type: commit_gate_attestation_and_trust_architecture
    status: specified
    receives: [Nexus_V, Evidence_Provenance, Authority_Tokens]
    feeds: [Commit_Records, Trust_Telemetry, Rollback_Control, LODE_TV, RoomSense, Janus_Interior_Face]
    boundary_rule: "Logical/cryptographic authority remains independently verifiable; physical channel separation is defense-in-depth only."

  Lightcore:
    name: "Lightcore"
    type: future_physical_execution_profile
    status: speculative
    definition: "XYZ CNT-silicon-photonic heterogeneous compute, memory and optical transport research beneath stable Nexus-V/Aegis contracts."
    receives: [Nexus_V, Aegis]
    feeds: [LODE_TV, RoomSense, Photonic_Compute_R_and_D]
    boundary_rule: "Optical/CNT/crystal state is working/cache/replica state unless retired through authoritative RSM/Aegis paths."

  LODE_TV:
    name: "L.O.D.E TV"
    expansion: "Lightcore Optical Display Endpoint"
    type: optical_display_telemetry_and_sensor_endpoint
    status: specified
    receives: [Lightcore, Aegis, OASIS]
    feeds: [RoomSense, Display_Telemetry, XR_Interaction, Optical_UI, Janus_AI]
    engineering_status: "Measured concept package exists; not a certified manufacturing release."

  RoomSense:
    name: "RoomSense"
    type: local_first_room_scale_spatial_sensing_fabric
    status: conceptual
    receives: [LODE_TV, Lightcore, Headset_Sensors, Room_Towers]
    feeds: [BodyRig, Sentinel_Security, OASIS, Athena_AI_OS, Janus_AI, OASIS_Runtime_Interface]
    privacy_rule: "RF/LiDAR/depth/motion fields are pseudonymous by default; familiarity and identity are separate consent-based modes."

  BodyRig:
    name: "RoomSense BodyRig"
    type: markerless_relational_full_body_tracking_layer
    status: conceptual
    receives: [RoomSense]
    feeds: [OpenXR_Integration, SteamVR_OSC_Integration, Motion_Capture, Embodied_Motion_Fidelity, OASIS_Runtime_Interface, Janus_AI]

  Reality_to_Simulation:
    name: "Reality-to-Simulation Multisensor Platform"
    type: calibrated_multimodal_capture_and_fusion_platform
    status: conceptual
    receives: [Optical_Sensors, Spectral_Sensors, Thermal_Sensors, LiDAR_Depth, RF_Radar, Environmental_Sensors]
    feeds: [Evidence_Provenance, Material_Atlas, Known_Behavioral_Map, OASIS]
    boundary_rule: "Outputs label measured, derived, inferred, hypothesized and unknown states separately."

  Known_Behavioral_Map:
    name: "Known Behavioral Map / Material Atlas"
    type: multidomain_material_behavior_database_and_inference_layer
    status: conceptual
    receives: [Reality_to_Simulation, Controlled_Test_Campaigns]
    feeds: [OASIS, Athena_AI_OS, Janus_AI, Engineering_Simulation]
    boundary_rule: "10,000 conditions × 10 repeats is proposed campaign scale, not completed evidence."

  Legacy_Operative_Duplex_AI:
    name: "Operative Duplex AI"
    type: legacy_alias_for_janus_internal_duplex
    status: superseded
    definition: "Historical name retained for provenance; canonical identity is JANUS."
    feeds: [Janus_AI]

plugin_surfaces:
  GitHub:
    role: canonical_repository_commit_issue_pull_request_and_trace_surface
    source_of_truth: true
    allowed_for: [sanitized_documentation, issues, pull_requests, public_architecture_specs, reviewed_code]
    prohibited: [raw_private_chats, credentials, local_runtime_dumps, private_sensor_data, database_dumps]
  Notion:
    role: planning_dashboard_and_documentation_mirror
    source_of_truth: false
  Google_Drive:
    role: distribution_and_native_document_mirror
    source_of_truth: false
  Asana:
    role: execution_queue_and_status_management
    source_of_truth: false
  Figma:
    role: editable_architecture_and_interface_diagrams
    source_of_truth: false
  Canva:
    role: controlled_infographics_and_visual_communication
    source_of_truth: false
  Gamma:
    role: presentation_and_communication_artifacts
    source_of_truth: false
  Consensus:
    role: peer_reviewed_research_anchor_search
    source_of_truth: false
  SciSpace:
    role: independent_academic_cross_check
    source_of_truth: false
  Wolfram:
    role: mathematics_physics_and_geometry_sanity_check
    source_of_truth: false
  Local_Athena_Tools:
    role: integrity_manifest_project_map_forensics_and_cycle_validation
    source_of_truth: local_first

hot_swap_primitives:
  commit: "Save verified state or accepted documentation."
  branch: "Create alternate design or operation state."
  fork: "Create independent project/capsule line."
  merge: "Reconcile validated branches."
  diff: "Compare states, assumptions, schemas, artifacts or expected/observed outcomes."
  rebase: "Move a project onto a newer architecture foundation."
  rollback: "Restore a known-good state."
  snapshot: "Freeze state for audit, simulation or handoff."
  hotswap: "Replace a model, adapter, backend or runtime without losing durable context."
  clone: "Copy a project capsule, sandbox, application state or Skill Capsule."
  promote: "Move validated knowledge upward under governance."
  quarantine: "Hold unsafe, private, contaminated, ambiguous or unvalidated state outside canonical memory."

